<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <link rel="icon" href="/static/images/ticket-system-logo.png" type="image/png">
    <link rel="shortcut icon" href="/static/images/ticket-system-logo.png">

    <title>Smart Queue 2035</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100 min-h-screen">

    <!-- HEADER -->

    <div class="bg-blue-600 p-6 rounded-b-3xl shadow-lg">

        <h1 class="text-3xl font-bold text-white">
            Smart Queue 2035
        </h1>

        <p class="text-blue-100 mt-2">
            Gestion intelligente des files
        </p>

    </div>

    <!-- CONTENU -->

    <div class="p-6">

        <h2 class="text-2xl font-bold text-gray-800 mb-6">

            Choisissez un service

        </h2>

        <div class="space-y-4">

            {% for service in services %}

            <button
                onclick="choisirService({{ service.id }})"
                class="
                    w-full
                    bg-white
                    p-5
                    rounded-2xl
                    shadow
                    text-left
                    hover:bg-blue-600
                    hover:text-white
                    transition
                "
            >

                <div class="text-xl font-semibold">

                    {{ service.nom }}

                </div>

            </button>

            {% endfor %}

        </div>

    </div>

    <!-- SCRIPT -->

    <script>

        let serviceSelectionne = null
    
        let nomClient = ""
    
        // =========================
        // CHOISIR SERVICE
        // =========================
    
        function choisirService(serviceId)
        {
            serviceSelectionne = serviceId
    
            ouvrirModal()
        }
    
        // =========================
        // OUVRIR MODAL
        // =========================
    
        function ouvrirModal()
        {
            document
                .getElementById("modalNom")
                .classList.remove("hidden")
        }
    
        // =========================
        // VALIDER NOM
        // =========================
    
        function validerNom()
        {
            const input =
                document.getElementById(
                    "clientName"
                )
    
            const nom =
                input.value.trim()
    
            if (!nom)
            {
                input.focus()
                return
            }
    
            nomClient = nom
    
            document
                .getElementById("modalNom")
                .classList.add("hidden")
    
            creerTicket()
        }
    
        // =========================
        // CREER TICKET
        // =========================
    
        async function creerTicket()
        {
    
            const response = await fetch(
                '/create_ticket',
                {
    
                    method: 'POST',
    
                    headers: {
                        'Content-Type':
                        'application/json'
                    },
    
                    body: JSON.stringify({
    
                        client: nomClient,
    
                        service_id: serviceSelectionne
    
                    })
    
                }
            )
    
            const data = await response.json()
    
            window.location.href =
                `/ticket_page`
                +
                `?numero=${data.numero}`
                +
                `&position=${data.position}`
                +
                `&temps=${data.temps_estime}`
        }
    
    </script>

        <div id="modalNom"
        class="
            fixed inset-0
            bg-black/50
            hidden
            flex
            items-center
            justify-center
            z-50
        "
    >

        <div class="
            bg-white
            rounded-3xl
            p-6
            w-11/12
            max-w-sm
            shadow-2xl
            animate-fade
        ">

            <h2 class="
                text-2xl
                font-bold
                text-gray-800
                mb-4
            ">
                Votre nom
            </h2>

            <input
                type="text"
                id="clientName"
                placeholder="Ex: Jean Dupont"
                class="
                    w-full
                    border
                    border-gray-300
                    rounded-2xl
                    p-4
                    text-lg
                    focus:outline-none
                    focus:ring-2
                    focus:ring-blue-500
                "
            >

            <button
                onclick="validerNom()"
                class="
                    mt-5
                    w-full
                    bg-blue-600
                    hover:bg-blue-700
                    text-white
                    py-4
                    rounded-2xl
                    text-lg
                    font-bold
                    transition
                "
            >
                Continuer
            </button>

        </div>

    </div>


</body>
</html>
